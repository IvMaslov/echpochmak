# Trino Iceberg connector backed by the echpochmak REST catalog.
# ${ENV:...} values are resolved by Trino from the container environment.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://catalog:8181

# Data and metadata files live in MinIO.
fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.path-style-access=true
s3.region=${ENV:S3_REGION}
s3.aws-access-key=${ENV:S3_ACCESS_KEY}
s3.aws-secret-key=${ENV:S3_SECRET_KEY}
