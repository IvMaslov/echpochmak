# Local development environment: MinIO (S3), the catalog server and Trino.
#
#   make compose-up      start everything (builds the catalog image)
#   make trino-cli       open a Trino shell
#
# For a faster edit-run loop, run only the dependencies here and the catalog
# on the host with `make run`:
#
#   docker compose -f deployments/compose/docker-compose.yaml up -d minio minio-init
#
# The official MinIO images are no longer published, so this uses the
# community-maintained build of the same AGPL code (pgsty/minio), pinned to a
# release. It also ships the `mc` client used by minio-init.

name: echpochmak

services:
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio-init:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        echo "bucket $$MINIO_BUCKET is ready"
    restart: "no"

  catalog:
    build:
      context: ../..
      dockerfile: build/catalog-server/Dockerfile
      # Set BUILD_NETWORK=host in .env if the build cannot reach the Go module
      # proxy from Docker's default bridge network (e.g. behind some VPNs).
      network: ${BUILD_NETWORK:-default}
    image: echpochmak/catalog-server:dev
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      ECHPOCHMAK_HTTP_ADDR: ":8181"
      ECHPOCHMAK_LOG_FORMAT: text
      ECHPOCHMAK_LOG_LEVEL: debug
      ECHPOCHMAK_S3_ENDPOINT: http://minio:9000
      ECHPOCHMAK_S3_REGION: ${S3_REGION}
      ECHPOCHMAK_S3_WAREHOUSE: s3://${MINIO_BUCKET}/
      ECHPOCHMAK_S3_PATH_STYLE: "true"
      ECHPOCHMAK_S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      ECHPOCHMAK_S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    ports:
      - "8181:8181"

  trino:
    image: trinodb/trino:484
    depends_on:
      - catalog
    environment:
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_REGION: ${S3_REGION}
    ports:
      - "8080:8080"
    volumes:
      - ./trino/catalog/iceberg.properties:/etc/trino/catalog/iceberg.properties:ro

  # A 3-node KV cluster, under the "kv" profile: start it with
  # `docker compose --profile kv up`. The catalog does not use it until
  # Phase 3. Client ports on the host: 23791-23793.
  kv1: &kv-node
    profiles: ["kv"]
    build:
      context: ../..
      dockerfile: build/kv-node/Dockerfile
      network: ${BUILD_NETWORK:-default}
    image: echpochmak/kv-node:dev
    environment: &kv-env
      ECHPOCHMAK_KV_ID: "1"
      ECHPOCHMAK_KV_DATA_DIR: /data
      ECHPOCHMAK_KV_INITIAL_CLUSTER: 1=http://kv1:2380,2=http://kv2:2380,3=http://kv3:2380
      ECHPOCHMAK_KV_LOG_FORMAT: text
    ports:
      - "23791:2379"
    volumes:
      - kv1-data:/data

  kv2:
    <<: *kv-node
    environment:
      <<: *kv-env
      ECHPOCHMAK_KV_ID: "2"
    ports:
      - "23792:2379"
    volumes:
      - kv2-data:/data

  kv3:
    <<: *kv-node
    environment:
      <<: *kv-env
      ECHPOCHMAK_KV_ID: "3"
    ports:
      - "23793:2379"
    volumes:
      - kv3-data:/data

networks:
  default:
    ipam:
      config:
        # Docker picks a free subnet by default. Set COMPOSE_SUBNET in .env if
        # it cannot ("all predefined address pools have been fully subnetted"),
        # which happens when a VPN routes the whole address space.
        - subnet: ${COMPOSE_SUBNET:-172.28.0.0/24}

volumes:
  minio-data:
  kv1-data:
  kv2-data:
  kv3-data:
