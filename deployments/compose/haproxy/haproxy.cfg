# Load balancer in front of the catalog replicas of the HA stack.
#
# Health checks use /readyz: a replica cut off from the KV quorum, or one
# draining before shutdown, reports 503 and stops getting new requests.
# Requests are retried on the other replica only when the connection failed,
# so the request certainly never reached a catalog; anything else is left to
# the client, which may retry with an Idempotency-Key.

global
    log stdout format raw local0 info

defaults
    mode http
    log global
    option httplog
    timeout connect 2s
    timeout client 120s
    timeout server 120s
    retries 2
    option redispatch
    retry-on conn-failure

# Docker's DNS: replicas get new addresses when they restart.
resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 1s

frontend catalog
    bind :8181
    default_backend catalogs

# Statistics page: the state of every replica, its checks and its traffic.
frontend stats
    bind :8404
    stats enable
    stats uri /stats
    stats refresh 5s

backend catalogs
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server check inter 1s fall 2 rise 2 resolvers docker init-addr last,libc,none
    server catalog-a catalog-a:8181
    server catalog-b catalog-b:8181
